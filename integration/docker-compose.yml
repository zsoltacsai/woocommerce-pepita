name: wps-pepita-integration

x-wordpress-env: &wordpress-env
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wps_it_password}
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_DEBUG', true );
    define( 'WP_DEBUG_LOG', __DIR__ . '/wp-content/debug.log' );
    define( 'WP_DEBUG_DISPLAY', false );
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    // Cron is executed explicitly by the test harness, never by page loads.
    define( 'DISABLE_WP_CRON', true );
    define( 'AUTOMATIC_UPDATER_DISABLED', true );
    define( 'WP_AUTO_UPDATE_CORE', false );

x-cli-service: &cli-service
  image: ${WORDPRESS_CLI_IMAGE:-wordpress:cli-2.12.0-php8.5}
  # Match the Apache image's www-data UID for shared-volume writes.
  user: "33:33"
  depends_on:
    db:
      condition: service_healthy
  environment: &cli-environment
    WORDPRESS_DB_HOST: db:3306
    WORDPRESS_DB_USER: wordpress
    WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wps_it_password}
    WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    WPS_FEED_TOKEN: ${WPS_FEED_TOKEN:-it-feed-token-0123456789abcdef0123456789abcdef}
    WPS_ORDER_API_KEY: ${WPS_ORDER_API_KEY:-it-order-key-0123456789abcdef0123456789abcdef}
  entrypoint: ["sleep", "infinity"]

services:
  db:
    image: ${MYSQL_IMAGE:-mysql:8.4.13}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wps_it_root}
      MYSQL_DATABASE: wps_hpos
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wps_it_password}
    volumes:
      - db-data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s

  wordpress-hpos:
    image: ${WORDPRESS_IMAGE:-wordpress:7.1.4-php8.5-apache}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HPOS_PORT:-8080}:80"
    environment:
      <<: *wordpress-env
      WORDPRESS_DB_NAME: wps_hpos
    volumes:
      - wp-hpos:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 80) ? 0 : 1);'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  wordpress-legacy:
    image: ${WORDPRESS_IMAGE:-wordpress:7.1.4-php8.5-apache}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LEGACY_PORT:-8081}:80"
    environment:
      <<: *wordpress-env
      WORDPRESS_DB_NAME: wps_legacy
    volumes:
      - wp-legacy:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 80) ? 0 : 1);'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  cli-hpos:
    <<: *cli-service
    environment:
      <<: *cli-environment
      WORDPRESS_DB_NAME: wps_hpos
    volumes:
      - wp-hpos:/var/www/html
      - ../dist:/dist:ro
      - ./tests:/integration/tests:ro
      - ./fixtures:/integration/fixtures:ro
      - ./mu-plugins:/integration/mu-plugins:ro

  cli-legacy:
    <<: *cli-service
    environment:
      <<: *cli-environment
      WORDPRESS_DB_NAME: wps_legacy
    volumes:
      - wp-legacy:/var/www/html
      - ../dist:/dist:ro
      - ./tests:/integration/tests:ro
      - ./fixtures:/integration/fixtures:ro
      - ./mu-plugins:/integration/mu-plugins:ro

volumes:
  db-data:
  wp-hpos:
  wp-legacy:
